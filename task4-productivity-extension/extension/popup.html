<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:280px;margin:0;padding:18px;background:#0f172a;color:#fff}.pill{padding:10px 12px;background:#1e293b;border-radius:12px;margin-top:10px}.muted{color:#94a3b8;font-size:12px}a{color:#7dd3fc}</style></head><body><h2>EliteTech Tracker</h2><div class="pill">Tracking active website time</div><p class="muted">Only hostname, category and duration are sent to the configured analytics backend.</p><p id="id" class="muted"></p><a id="dashboard" target="_blank">Open my dashboard</a><script src="config.js"></script><script>chrome.storage.local.get('trackerUserId').then(async r=>{let id=r.trackerUserId;if(!id){id=crypto.randomUUID();await chrome.storage.local.set({trackerUserId:id})}document.getElementById('id').textContent=`User ID: ${id.slice(0,8)}…`;document.getElementById('dashboard').href=`${API_BASE}/?userId=${encodeURIComponent(id)}`})</script></body></html>
