<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productivity Analytics</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18233a;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1150px,94%);margin:35px auto}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.top h1{margin:0;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.05em}.top p{color:#697991}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #e4eaf2;border-radius:20px;padding:20px;box-shadow:0 15px 40px #2233540d}.label{color:#74839a;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}.metric{font-size:2.2rem;font-weight:900;margin-top:8px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.chartbox{height:330px}.sites{margin-top:16px}.site{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #edf0f5}.tag{padding:4px 8px;border-radius:999px;font-size:.72rem;font-weight:800}.productive{background:#dcfce7;color:#166534}.unproductive{background:#fee2e2;color:#991b1b}.neutral{background:#e2e8f0;color:#475569}@media(max-width:800px){.cards,.charts{grid-template-columns:1fr}.chartbox{height:280px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="label">EliteTech Intern · Task 4</div><h1>Productivity Analytics</h1><p>Weekly view of active website time and productivity classification.</p></div><button id="refresh">Refresh</button></div><div class="cards"><div class="card"><div class="label">Total time</div><div id="total" class="metric">—</div></div><div class="card"><div class="label">Productive time</div><div id="productive" class="metric">—</div></div><div class="card"><div class="label">Productivity rate</div><div id="rate" class="metric">—</div></div></div><div class="charts"><div class="card chartbox"><canvas id="dailyChart"></canvas></div><div class="card chartbox"><canvas id="siteChart"></canvas></div></div><div class="card sites"><h2>Top websites</h2><div id="siteList">Loading…</div></div></div><script>
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`};let dailyChart,siteChart;
async function load(){const userId=new URLSearchParams(location.search).get('userId')||'anonymous';const d=await fetch(`/api/analytics?days=7&userId=${encodeURIComponent(userId)}`).then(r=>r.json());document.getElementById('total').textContent=fmt(d.totalSeconds);document.getElementById('productive').textContent=fmt(d.productiveSeconds);document.getElementById('rate').textContent=`${d.productivityRate}%`;const sites=[...d.sites].sort((a,b)=>b.seconds-a.seconds).slice(0,8);document.getElementById('siteList').innerHTML=sites.length?sites.map(s=>`<div class="site"><span>${s.hostname}</span><span><span class="tag ${s.category}">${s.category}</span> ${fmt(s.seconds)}</span></div>`).join(''):'No tracking data yet. Load the extension and browse some sites.';const dates=[...new Set(d.daily.map(x=>x.date))];const prod=dates.map(date=>d.daily.find(x=>x.date===date&&x.category==='productive')?.seconds||0);const unprod=dates.map(date=>d.daily.find(x=>x.date===date&&x.category==='unproductive')?.seconds||0);dailyChart?.destroy();dailyChart=new Chart(document.getElementById('dailyChart'),{type:'bar',data:{labels:dates,datasets:[{label:'Productive',data:prod},{label:'Unproductive',data:unprod}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}}}});siteChart?.destroy();siteChart=new Chart(document.getElementById('siteChart'),{type:'doughnut',data:{labels:sites.map(s=>s.hostname),datasets:[{data:sites.map(s=>s.seconds)}]},options:{responsive:true,maintainAspectRatio:false}})}document.getElementById('refresh').onclick=load;load();
</script></body></html>
