<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EliteChat</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:Inter,system-ui,sans-serif}.app{width:min(900px,94%);height:92vh;margin:4vh auto;background:#11182c;border:1px solid #27304b;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 90px #0008}.top{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #27304b}.brand{font-size:1.3rem;font-weight:900}.status{color:#8fa0bf;font-size:.9rem}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;padding:11px 14px;border-radius:16px;background:#1c2742;align-self:flex-start}.msg.me{background:#4f46e5;align-self:flex-end}.meta{font-size:.72rem;opacity:.7;margin-bottom:4px}.system{text-align:center;color:#8fa0bf;font-size:.82rem;padding:6px}.typing{height:24px;padding:0 22px;color:#8fa0bf;font-size:.82rem}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid #27304b}.composer input,.composer button,.name input{border:0;border-radius:12px;padding:13px}.composer input{flex:1;background:#0b1020;color:#fff}.composer button,.name button{background:#6366f1;color:#fff;font-weight:800;cursor:pointer}.overlay{position:fixed;inset:0;background:#050814eF;display:grid;place-items:center}.name{background:#11182c;padding:28px;border:1px solid #27304b;border-radius:20px;width:min(400px,90%)}.name h1{margin-top:0}.name input{width:100%;margin:10px 0;background:#0b1020;color:#fff}.name button{width:100%}</style></head><body>
<div class="app"><div class="top"><div class="brand">💬 EliteChat</div><div class="status"><span id="online">0</span> online</div></div><div id="messages" class="messages"></div><div id="typing" class="typing"></div><form id="composer" class="composer"><input id="text" autocomplete="off" placeholder="Write a message…"><button>Send</button></form></div>
<div id="overlay" class="overlay"><form id="nameForm" class="name"><h1>Join the chat</h1><p>Choose a display name to start.</p><input id="name" maxlength="24" placeholder="Your name" required><button>Enter chat</button></form></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io();let me='';const messages=document.getElementById('messages');
const add=(html,cls='')=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;messages.appendChild(d);messages.scrollTop=messages.scrollHeight};
function time(iso){return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
document.getElementById('nameForm').addEventListener('submit',e=>{e.preventDefault();me=document.getElementById('name').value.trim();if(!me)return;socket.emit('join',me);document.getElementById('overlay').style.display='none';document.getElementById('text').focus()});
document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('text');if(i.value.trim()){socket.emit('chat-message',i.value);i.value='';socket.emit('typing',false)}});
let typingTimer;document.getElementById('text').addEventListener('input',()=>{socket.emit('typing',true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>socket.emit('typing',false),700)});
socket.on('chat-message',m=>add(`<div class="meta">${m.name} · ${time(m.time)}</div><div>${m.text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`,m.name===me?'msg me':'msg'));
socket.on('system',m=>add(`${m.text} · ${time(m.time)}`,'system'));socket.on('online-count',n=>document.getElementById('online').textContent=n);socket.on('typing',d=>document.getElementById('typing').textContent=d.isTyping?`${d.name} is typing…`:'' );
</script></body></html>
